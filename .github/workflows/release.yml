# 태그(v*)를 올리면 GHCR 과 Docker Hub 에 멀티아키 이미지를 올립니다.
#
#   git tag v2.1.0 && git push origin v2.1.0
#
# - GHCR: 저장소 기본 GITHUB_TOKEN 으로 올립니다(permissions: packages: write).
# - Docker Hub: 저장소 Secrets 에 DOCKERHUB_USERNAME, DOCKERHUB_TOKEN 이 있을 때만 올립니다.
#   없으면 그 단계는 건너뜁니다.
# - push 전에 go vet/test, node --test(web/test), smoke 시험(--network none --read-only, 2.0 컬렉션·가져오기·일정 포함), trivy(HIGH·CRITICAL 0건)를 통과해야 합니다.
# - SBOM 과 provenance(mode=max)를 이미지에 함께 붙입니다.
# - Windows 실행 파일(zip)을 만들어 windows-latest 에서 실제로 실행해 보고(scripts/smoke-windows.ps1),
#   GitHub Release 에 올리며, 인터넷이 막힌 PC 용으로 같은 zip 을 '<버전>-windows' 태그 묶음 이미지로도 올립니다.
# - 공급망 보호: 액션은 커밋 SHA, Trivy 는 digest 로 고정합니다(올릴 때 주석의 버전과 함께 바꿉니다).
#   Trivy 에는 docker.sock 을 넘기지 않고, docker save 로 만든 tar 만 읽기 전용으로 넘깁니다.
#   Docker Hub 비밀값은 그 값이 필요한 단계에만 env 로 넘깁니다.
#
# 처음 한 번: GHCR 패키지는 비공개로 만들어집니다.
#   GitHub → Packages → manager-notebook → Package settings → Change visibility → Public

name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PLATFORMS: linux/amd64,linux/arm64
  TRIVY_IMAGE: aquasec/trivy:0.65.0@sha256:a22415a38938a56c379387a8163fcb0ce38b10ace73e593475d3658d578b2436
  CHECK_TAG: manager-notebook:ci

jobs:
  windows:
    name: Windows 실행 파일 만들기
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          # 이미지와 같은 이유로 1.26 최신 패치로 빌드합니다(1.24 로 만든 실행 파일은 표준 라이브러리 HIGH·CRITICAL 이 나옴).
          go-version: "1.26.x"
          check-latest: true
          cache: true

      - name: Build zips
        run: bash scripts/build-windows.sh "${GITHUB_REF_NAME#v}" dist

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  windows-smoke:
    name: Windows 에서 실행 시험
    needs: windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-dist
          path: dist

      - name: Smoke (amd64)
        shell: pwsh
        run: |
          $v = "$env:GITHUB_REF_NAME".TrimStart("v")
          Expand-Archive -Path "dist/manager-notebook-$v-windows-amd64.zip" -DestinationPath "nbexe"
          pwsh -File scripts/smoke-windows.ps1 -Exe "nbexe/manager-notebook.exe" -Expected $v

  release:
    needs: windows-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write   # GitHub Release 에 zip 을 올립니다
      packages: write
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # GITHUB_TOKEN 을 .git/config 에 남기지 않습니다(뒤 단계에서 쓸 일이 없음).
          persist-credentials: false

      - name: Version and tags
        id: meta
        shell: bash
        env:
          # secrets 는 if: 에서 바로 쓸 수 없어서, 있는지 확인하는 이 단계에만 넘깁니다.
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::태그는 v2.1.0 같은 형식이어야 합니다: ${GITHUB_REF_NAME}"
            exit 1
          fi
          GHCR="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/manager-notebook"
          TAGS=("$GHCR:$VERSION" "$GHCR:latest")
          BUNDLE_TAGS=("$GHCR:$VERSION-windows")
          HUB_ENABLED=false
          if [[ -n "${DOCKERHUB_USERNAME}" && -n "${DOCKERHUB_TOKEN}" ]]; then
            HUB_ENABLED=true
            HUB="docker.io/${DOCKERHUB_USERNAME,,}/manager-notebook"
            TAGS+=("$HUB:$VERSION" "$HUB:latest")
            BUNDLE_TAGS+=("$HUB:$VERSION-windows")
          fi
          {
            echo "version=$VERSION"
            echo "ghcr=$GHCR"
            echo "hub_enabled=$HUB_ENABLED"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "tags<<__TAGS__"
            printf '%s\n' "${TAGS[@]}"
            echo "__TAGS__"
            echo "bundle_tags<<__BTAGS__"
            printf '%s\n' "${BUNDLE_TAGS[@]}"
            echo "__BTAGS__"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet / go test
        run: |
          go vet ./...
          go test ./...

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: node --test (화면 계산 시험)
        # web/core.js 의 근무일 시계·자리 계산·초안 조립 시험. 시간대를 고정해야 결과가 같습니다.
        env:
          TZ: Asia/Seoul
        run: node --test web/test/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        # 빌드 단계가 $BUILDPLATFORM 에서 Go 교차 컴파일을 하므로 QEMU 는 필요 없습니다.

      - name: Build check image (amd64, local)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.CHECK_TAG }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (--network none --read-only)
        env:
          EXPECTED_VERSION: ${{ steps.meta.outputs.version }}
        run: bash scripts/smoke.sh "$CHECK_TAG"

      - name: Trivy scan (HIGH, CRITICAL = 0)
        # docker.sock 대신 이미지 tar 만 읽기 전용으로 넘깁니다(스캐너가 러너의 Docker 를 쓰지 못하게).
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/scan"
          docker save "$CHECK_TAG" -o "$RUNNER_TEMP/scan/image.tar"
          docker run --rm \
            -v "$RUNNER_TEMP/scan:/scan:ro" \
            "$TRIVY_IMAGE" image \
              --input /scan/image.tar \
              --scanners vuln \
              --severity HIGH,CRITICAL \
              --exit-code 1 \
              --no-progress
          rm -rf "$RUNNER_TEMP/scan"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.meta.outputs.hub_enabled == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Hub skipped
        if: steps.meta.outputs.hub_enabled != 'true'
        run: echo "::notice::DOCKERHUB_USERNAME 또는 DOCKERHUB_TOKEN secret 이 없어 Docker Hub push 를 건너뜁니다. GHCR 에만 올립니다."

      - name: Build and push (multi-arch, SBOM, provenance)
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
            org.opencontainers.image.revision=${{ github.sha }}
          annotations: |
            index:org.opencontainers.image.title=manager-notebook
            index:org.opencontainers.image.description=프로그램 리드 체계용 개인 관리 수첩. 외부 연결 없음, 데이터는 /data 볼륨에만 저장.
            index:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            index:org.opencontainers.image.licenses=MIT
            index:org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          cache-from: type=gha

      - name: Verify pushed image
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          GHCR: ${{ steps.meta.outputs.ghcr }}
          VERSION: ${{ steps.meta.outputs.version }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          REF="$GHCR:$VERSION"
          docker buildx imagetools inspect "$REF"
          SBOM_JSON=$(docker buildx imagetools inspect "$REF" --format '{{json .SBOM}}')
          PROV_JSON=$(docker buildx imagetools inspect "$REF" --format '{{json .Provenance}}')
          [[ $SBOM_JSON == *SPDX* ]] || { echo "::error::SBOM 이 없습니다"; exit 1; }
          [[ $PROV_JSON == *SLSA* ]] || { echo "::error::provenance 가 없습니다"; exit 1; }
          {
            echo "## manager-notebook $VERSION"
            echo
            echo "- digest: \`$DIGEST\`"
            echo "- 아키텍처: $PLATFORMS"
            echo "- 태그:"
            while IFS= read -r t; do
              if [[ -n $t ]]; then echo "  - \`$t\`"; fi
            done <<< "$TAGS"
            echo
            echo "GHCR 패키지가 처음 만들어졌다면 Package settings 에서 Public 으로 바꿔 주세요."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Download Windows zips
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-dist
          path: dist

      - name: Trivy scan (Windows 실행 파일, HIGH·CRITICAL = 0)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/winscan"
          for z in dist/*.zip; do unzip -q -o "$z" manager-notebook.exe -d "$RUNNER_TEMP/winscan/$(basename "$z" .zip)"; done
          find "$RUNNER_TEMP/winscan" -name manager-notebook.exe | grep -q . || { echo "::error::검사할 실행 파일이 없습니다"; exit 1; }
          docker run --rm \
            -v "$RUNNER_TEMP/winscan:/scan:ro" \
            "$TRIVY_IMAGE" rootfs /scan \
              --scanners vuln \
              --severity HIGH,CRITICAL \
              --exit-code 1 \
              --no-progress
          rm -rf "$RUNNER_TEMP/winscan"

      - name: Push Windows bundle image (<버전>-windows)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: dist
          file: packaging/windows-bundle.Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.bundle_tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          GHCR: ${{ steps.meta.outputs.ghcr }}
        run: |
          set -euo pipefail
          {
            echo "## manager-notebook $VERSION"
            echo
            echo "### Docker"
            echo '```'
            echo "docker pull $GHCR:$VERSION"
            echo '```'
            echo
            echo "### Windows 실행 파일"
            echo "- \`manager-notebook-$VERSION-windows-amd64.zip\` 을 받아 풀고 \`manager-notebook.exe\` 를 실행합니다. 체험은 \`run-demo.cmd\`."
            echo "- 받은 파일의 SHA-256 은 \`SHA256SUMS.txt\` 와 같아야 합니다."
            echo "- 인터넷이 막힌 PC 에서 레지스트리만 열려 있으면:"
            echo '```'
            echo "docker pull $GHCR:$VERSION-windows"
            echo "docker create --name nb-exe $GHCR:$VERSION-windows x"
            echo "docker cp nb-exe:/manager-notebook-$VERSION-windows-amd64.zip ."
            echo "docker cp nb-exe:/SHA256SUMS.txt ."
            echo "docker rm nb-exe"
            echo '```'
            echo
            echo "코드 서명이 없는 실행 파일입니다. 회사 PC 에서는 보안 담당자의 반입 승인을 먼저 받으세요."
          } > "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" dist/*.zip dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "manager-notebook $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag
